# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: Package (tests + lint)
    # Pinned deliberately. `macos-latest` moves between major versions and will
    # change the default Xcode and SDK underneath the project without warning.
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: Packages/ScreenSculptKit/.build
          key: spm-${{ runner.os }}-${{ hashFiles('Packages/ScreenSculptKit/Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      # Split by what each group needs from the machine, with its own timeout.
      # A single `swift test` step that stalls reports only that the job hit the
      # job-level limit, which says nothing about where — and the run logs are
      # not readable without a token. Separate steps make the failure legible
      # from the API alone, which is how the Vision stall below was found.
      #
      # Most of the suite is pure functions over synthetic input: no window
      # server, no TCC grant, no app launch. That is the whole reason the logic
      # lives in a package rather than in the app target.
      - name: Test (headless logic)
        timeout-minutes: 10
        run: |
          swift test --package-path Packages/ScreenSculptKit \
            --skip SSRecognitionTests --skip SSEditorUITests

      # Recognition, with the Vision-backed cases skipped. Measured on this
      # runner: they hang until the step is killed, while everything else in the
      # suite finishes in under two minutes. Vision wants language models a
      # fresh machine has never cached. The reading-order and coordinate maths
      # still run here; the cases that need Vision run on a real Mac and report
      # as skipped rather than as passed.
      - name: Test (recognition, Vision skipped)
        timeout-minutes: 8
        env:
          SS_SKIP_VISION: "1"
        run: swift test --package-path Packages/ScreenSculptKit --filter SSRecognitionTests

      # AppKit. These build real windows and views to check draw ordering, and a
      # runner's window server is not a desktop session.
      - name: Test (AppKit views)
        timeout-minutes: 8
        run: swift test --package-path Packages/ScreenSculptKit --filter SSEditorUITests

      - name: Lint
        run: |
          brew install swiftlint
          swiftlint lint --strict

  app:
    name: App (universal build)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      # Fork pull requests receive no secrets, by design. Any signing step here
      # would fail on every external contribution — and routing around that with
      # `pull_request_target` would let an attacker exfiltrate repository
      # secrets. PR builds are unsigned, deliberately.
      - name: Build (Release, unsigned)
        run: |
          xcodebuild build \
            -project ScreenSculpt.xcodeproj \
            -scheme ScreenSculpt \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      # A single-arch Release ships silently and only Intel users find out, so
      # assert it rather than trusting the setting.
      - name: Assert universal binary
        run: |
          set -euo pipefail
          DIR=$(xcodebuild -project ScreenSculpt.xcodeproj -scheme ScreenSculpt \
                 -configuration Release -showBuildSettings 2>/dev/null \
                 | awk -F' = ' '/ BUILT_PRODUCTS_DIR/{print $2; exit}')
          BIN="$DIR/ScreenSculpt.app/Contents/MacOS/ScreenSculpt"
          ARCHS=$(lipo -archs "$BIN")
          echo "archs: $ARCHS"
          grep -q x86_64 <<< "$ARCHS" || { echo "::error::missing x86_64"; exit 1; }
          grep -q arm64  <<< "$ARCHS" || { echo "::error::missing arm64";  exit 1; }
